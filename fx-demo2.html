<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBK clash FX v2 demo</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#12394a;color:#fff7e8;font-family:'Pixelify Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;overflow-x:hidden}
h1{font-family:'Press Start 2P',monospace;font-size:15px;margin:4px 0}
.stage{position:relative;width:min(94vw,440px);height:270px;border-radius:14px;background:#0b2631;box-shadow:0 0 0 4px #0c0614;overflow:hidden}
.pair{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:90px}
.card{width:70px;height:98px;border-radius:9px;background:#fff7e8;box-shadow:0 0 0 3px #0c0614;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-top:9px solid var(--s);box-sizing:border-box}
.card img{width:48px;height:48px}.card b{font:400 24px 'Press Start 2P',monospace;color:#1b0d22}
.hammer{--s:#ff7a59}.paper{--s:#5aa9e8}.scissors{--s:#6fd3a0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:700 16px 'Pixelify Sans',sans-serif;padding:10px 14px;border:0;border-radius:8px;background:#ffd34d;color:#1b0d22;box-shadow:0 0 0 3px #0c0614;cursor:pointer}
button.alt{background:#5ad1c4}
label{display:flex;gap:10px;align-items:center;font-size:15px}input[type=range]{width:180px}
.fx-label{position:fixed;z-index:1006;pointer-events:none;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;text-shadow:3px 3px 0 #0c0614,-1px -1px 0 #0c0614;animation:fxLabel .8s steps(8) both;white-space:nowrap}
@keyframes fxLabel{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}20%{transform:translate(-50%,-60%) scale(1.3);opacity:1}100%{transform:translate(-50%,-100%) scale(1);opacity:0}}
small{opacity:.8}
</style></head><body>
<h1>CLASH FX v2</h1>
<div class="stage"><div class="pair" id="pair"></div></div>
<label>Damage <input id="dmg" type="range" min="1" max="18" value="6"><b id="dv">6</b></label>
<label><input id="crit" type="checkbox"> Critical (same number → x2 damage)</label>
<div class="row"><button data-t="smash">🔨 Hammer beats Scissors</button><button data-t="cut">✂ Scissors beat Paper</button><button data-t="portal">📄 Paper beats Hammer</button></div>
<div class="row"><button class="alt" data-p="1.1">Low</button><button class="alt" data-p="2.2">Mid</button><button class="alt" data-p="3.2">High</button><button class="alt" data-p="crit">CRITICAL</button></div>
<small>Low/Mid/High/Critical set the damage level, then press an effect.</small>
<script src="./fx2.js"></script>
<script>
const ICON={hammer:'./icons/hammer.png',paper:'./icons/paper.png',scissors:'./icons/scissors.png'};
const $=id=>document.getElementById(id),pw=d=>Math.max(.75,Math.min(3.2,.8+d*.17));
const cfg={smash:['hammer','scissors',7,2],cut:['scissors','paper',8,3],portal:['paper','hammer',6,4]};
function card(s,n){const d=document.createElement('div');d.className='card '+s;d.innerHTML=`<img src="${ICON[s]}" alt=""><b>${n}</b>`;return d}
let busy=false;
async function run(t){if(busy)return;busy=true;const [a,b,na,nb]=cfg[t],crit=$('crit').checked;
 const nbx=crit?na:nb;const pair=$('pair');pair.innerHTML='';const A=card(a,na),B=card(b,nbx);pair.append(A,B);
 await new Promise(r=>setTimeout(r,60));
 const t0=performance.now();await FX2.play(t,A,B,pw(+$('dmg').value),crit,+$('dmg').value);$('dv').title=Math.round(performance.now()-t0)+' ms';
 await new Promise(r=>setTimeout(r,250));pair.innerHTML='';A.getAnimations&&0;pair.append(card(a,na),card(b,nbx));busy=false}
FX2.jolt=v=>{const p=Math.min(10,v);document.body.animate([{transform:'translate(0,0)'},{transform:`translate(${-2-p}px,1px)`},{transform:`translate(${2+p}px,-1px)`},{transform:'translate(0,0)'}],{duration:180+p*20})};
$('dmg').oninput=e=>$('dv').textContent=e.target.value;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>run(b.dataset.t));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const v=b.dataset.p;if(v==='crit'){$('crit').checked=true;$('dmg').value=12}else{$('crit').checked=false;$('dmg').value=Math.round((+v-.8)/.17)}$('dv').textContent=$('dmg').value});
document.getElementById('pair').append(card('hammer',7),card('scissors',2));
</script></body></html>

<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="./crt.css?v=20261105c">
<style>
:root{--w:clamp(66px,21vw,84px)}
.lesson-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#1a1332;box-shadow:0 0 0 3px var(--crt-line);width:100%;border:0;color:inherit;font-family:var(--crt-font);text-align:left}
.lesson-row.cur{background:#3a2d63;box-shadow:0 0 0 3px var(--crt-line),0 0 0 6px var(--crt-gold)}
.lesson-row .no{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--crt-line);color:var(--crt-dim)}
.lesson-row.done .no{background:#2f9a6e;color:var(--crt-line)}
.lesson-row.cur .no{background:var(--crt-gold);color:var(--crt-dark)}
.lesson-row b{display:block;font-size:14px;letter-spacing:.05em}
.lesson-row small{display:block;font-size:11px;line-height:1.6;margin-top:5px;color:#b9aedb}
.lesson-row.lock b,.lesson-row.lock small{color:#7a6e96}
.lesson-row[disabled]{cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:12px}
.row-sp{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em}
.steps{display:flex;gap:6px;justify-content:center}.steps i{width:26px;height:8px;background:var(--crt-panel-in);box-shadow:0 0 0 2px var(--crt-line)}.steps i.on{background:var(--crt-gold)}
/* guided stage */
.stage{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.hpp{padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em}
.hpp .t{display:flex;justify-content:space-between}
.hpp .t span:last-child{font-family:var(--crt-num)}
.hpp .crt-bar i{transition:width .4s steps(8)}
.hpp.bot .crt-bar i{background:repeating-linear-gradient(90deg,var(--crt-coral) 0 7px,var(--crt-line) 7px 9px)}
.hpp.me .crt-bar i{background:repeating-linear-gradient(90deg,var(--crt-teal) 0 7px,var(--crt-line) 7px 9px)}
.row3{display:flex;justify-content:center;gap:clamp(8px,3vw,14px)}
.row3>*{width:var(--w);height:calc(var(--w)*1.36)}
.row3.pills>*{height:auto}
.back{border-radius:10px;background-color:#3b2a72;background-image:conic-gradient(#4d3a8c 25%,transparent 0 50%,#4d3a8c 0 75%,transparent 0);background-size:10px 10px;box-shadow:0 0 0 3px var(--crt-line),0 6px 0 3px var(--crt-line),inset 0 0 0 4px #7a63c4}
.pill{display:flex;align-items:center;justify-content:center;min-height:24px;padding:3px 4px;border-radius:7px;background:var(--crt-panel);color:var(--crt-mute);font-size:11px;letter-spacing:.04em;box-shadow:0 0 0 3px var(--crt-line);text-align:center}
.pill.me{background:var(--crt-gold);color:var(--crt-dark)}.pill.bot{background:var(--crt-coral);color:var(--crt-dark)}
.crt-card.win{box-shadow:0 0 0 3px var(--crt-line),0 0 0 6px var(--crt-gold),0 6px 0 3px var(--crt-line),inset 0 7px 0 var(--s,#ccc)}
.crt-card.lose{opacity:.5}
.crt-card.gone{opacity:.25;filter:grayscale(1);transform:translateY(8px) rotate(-6deg)}
.flip{animation:flip .25s steps(4)}@keyframes flip{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
.crt-card svg{width:40%;height:auto}
.row3 .crt-card b{font-size:22px!important}
.hint{animation:hint 1s steps(2) infinite;box-shadow:0 0 0 3px var(--crt-line),0 0 0 6px var(--crt-gold)!important}
@keyframes hint{50%{transform:translateY(-4px)}}
.crt-slot.hint{animation:hintring 1s steps(2) infinite;border-color:var(--crt-gold);color:var(--crt-gold)}
@keyframes hintring{50%{background:rgba(255,211,77,.18)}}
.hand{display:flex;justify-content:center;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.hand .crt-card{width:clamp(52px,16.5vw,64px);height:clamp(72px,22.5vw,88px)}
.hand .crt-card b{font-size:17px!important}
.hand .crt-card[disabled]{opacity:.35;cursor:not-allowed}
.coach{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--crt-panel);box-shadow:0 0 0 4px var(--crt-line),inset 0 0 0 3px var(--crt-gold);min-height:84px}
.coach .face{flex:none;width:40px;height:40px;border-radius:50%;background:var(--crt-gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--crt-line)}
.coach p{margin:0;font-size:13px;line-height:1.75;letter-spacing:.03em}
.coach.ok{box-shadow:0 0 0 4px var(--crt-line),inset 0 0 0 3px #6fd3a0}.coach.bad{box-shadow:0 0 0 4px var(--crt-line),inset 0 0 0 3px #ff7a8a}
.circle{display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;color:var(--crt-mute)}
.circle span{display:flex;align-items:center;gap:4px}
@media (prefers-reduced-motion:reduce){.hint,.crt-slot.hint,.flip{animation:none}}
</style>

<body class="crt-page">
<div class="crt-swirl"></div><div class="crt-vignette"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-hammer" viewBox="0 0 8 8"><path fill="#8a94a8" d="M0 0h8v3H0z"/><path fill="#d3dbe8" d="M0 0h8v1H0z"/><path fill="#5d667a" d="M0 2h8v1H0z"/><path fill="#a8703a" d="M3 3h2v5H3z"/><path fill="#7a4a22" d="M4 3h1v5H4z"/></symbol>

<symbol id="i-scissors" viewBox="0 0 8 8"><path fill="#6d768a" d="M1 0h1v1H1zM2 1h1v1H2zM3 2h1v1H3zM4 3h1v1H4zM5 4h1v1H5zM6 0h1v1H6zM5 1h1v1H5zM4 2h1v1H4zM3 3h1v1H3zM2 4h1v1H2z"/><path fill="#3a9a6e" fill-rule="evenodd" d="M0 5h3v3H0zM1 6h1v1H1zM5 5h3v3H5zM6 6h1v1H6z"/></symbol>

</svg>

<script>
(()=>{'use strict';
const app=document.getElementById('app');
const SUIT={hammer:'HAMMER',paper:'PAPER',scissors:'SCISSORS'};
const BEATS={hammer:'scissors',paper:'hammer',scissors:'paper'};   // key beats value
const LESSONS=[
 {t:'PLACE & LOCK IN',d:'Put cards in the slots and reveal.'},
 {t:'THE CIRCLE',d:'Beat all three enemy cards.'},
 {t:'BIG DAMAGE',d:'Deal 18+ damage in one round.'},
 {t:'DISCARD & DRAW',d:'Win a round, then discard a card.'},
 {t:'PRACTICE MATCH',d:'Beat the training bot to finish.'}
];
const step=()=>window.BBK?BBK.tutorial.get():0;
const el=(tag,attrs,...kids)=>{const n=document.createElement(tag);for(const k in attrs||{}){if(attrs[k]==null||attrs[k]===false)continue;if(k==='class')n.className=attrs[k];else if(k==='text')n.textContent=attrs[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),attrs[k]);else n.setAttribute(k,attrs[k]);}for(const c of kids.flat())if(c!=null)n.append(c.nodeType?c:document.createTextNode(c));return n;};
const svg=(id,w,h)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox','0 0 8 8');s.setAttribute('aria-hidden','true');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+id);s.append(u);return s;};
const card=(suit,n,cls='',tag='div',attrs={})=>el(tag,Object.assign({type:tag==='button'?'button':undefined,class:'crt-card '+suit+' '+cls,'aria-label':SUIT[suit].toLowerCase()+' '+n},attrs),svg('i-'+suit,30,30),el('b',{text:String(n)}));
const head=(title,backTo)=>el('div',{class:'crt-head'},el('a',{class:'crt-back','aria-label':'Back',href:backTo||'#',text:'← BACK',onclick:backTo?undefined:(e=>{e.preventDefault();go(null)})}),el('h1',{class:'crt-title',text:title}));
// same rules as the game server
function clash(a,b){
 if(a.suit===b.suit){if(a.n===b.n)return{w:-1,dmg:0};return{w:a.n>b.n?0:1,dmg:Math.abs(a.n-b.n)};}
 return{w:BEATS[a.suit]===b.suit?0:1,dmg:a.n===b.n?(a.n||10)*2:Math.abs(a.n-b.n)};
}
let view=null;           // null = lesson list, 1..5 = lesson
function go(v){if(stage.cancel)stage.cancel();view=v;render();window.scrollTo(0,0);}


/* ---------- lesson list ---------- */
function hub(){
 const s=step();
 const bar=el('div',{class:'crt-panel stack'},el('div',{class:'row-sp'},el('span',{style:'color:var(--crt-mute)',text:'PROGRESS'}),el('b',{style:'color:var(--crt-gold)',text:s+' / 5'})),
  el('div',{class:'crt-bar'},el('i',{style:'width:'+(s*20)+'%'})));
 const rows=LESSONS.map((L,i)=>{
  const k=i+1,state=k<=s?'done':k===s+1?'cur':'lock';
  const b=el('button',{type:'button',class:'lesson-row '+state,onclick:()=>{location.href=k===5?'./index.html?practice=1':'./index.html?lesson='+k}},
   el('span',{class:'no'},state==='done'?svg('i-check',22,22):state==='lock'?svg('i-lock',22,22):String(k)),
   el('span',{},el('b',{text:k+' · '+L.t}),el('small',{text:L.d})),
   state==='cur'?el('span',{class:'crt-badge crt-pulse',text:s===0?'START':'NEXT'}):el('span'));
  if(state==='lock')b.disabled=true;
  return b;
 });
 const done=s>=5;
 const reward=done
  ?el('div',{class:'crt-panel stack'},el('b',{style:'color:#6fd3a0;font-size:12px',text:'RANKED UNLOCKED'}),el('p',{class:'crt-note',text:'You finished the tutorial. Ranked matches are open to you.'}),el('a',{class:'crt-btn',href:'./online.html',text:'PLAY MULTIPLAYER'}))
  :el('div',{class:'crt-panel',style:'border:3px dashed var(--crt-gold)'},el('b',{style:'color:var(--crt-gold);font-size:11px',text:'REWARD'}),el('p',{class:'crt-note',style:'margin-top:8px',text:'Finish all 5 lessons to unlock RANKED matches.'}));
 return [head('TUTORIAL','./index.html'),bar,el('div',{class:'stack'},rows),el('div',{style:'margin-top:auto'},reward)];
}

const P=(t)=>el('p',{class:'crt-note',text:t});
/* ---------- guided stage: a real mini board with a coach ---------- */
const C=(suit,n)=>({suit,n});
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduced?Math.min(ms,80):ms));
const NAME={hammer:'Hammer',paper:'Paper',scissors:'Scissors'};
const why=(a,b,r)=>{               // a = your card, b = bot card
 if(r.w<0)return 'Same suit, same number: a tie, nobody takes damage.';
 const win=r.w===0?a:b,lose=r.w===0?b:a;
 if(a.suit===b.suit)return 'Same suit, so the higher number wins. '+(r.w===0?'Your ':'Its ')+win.n+' beats '+lose.n+': '+r.dmg+' damage.';
 const circle=NAME[win.suit]+' beats '+NAME[lose.suit]+'.';
 return a.n===b.n?circle+' Same number, so damage is doubled: '+r.dmg+'.':circle+' Damage is the gap, '+win.n+' − '+lose.n+' = '+r.dmg+'.';
};
const LV={
 1:{say:'Welcome! Each round you put one card in each of the 3 slots. The bot does the same in secret.',
   opp:[C('scissors',4),C('hammer',6),C('paper',2)],faceUp:false,hand:[C('hammer',7),C('paper',5),C('scissors',9),C('hammer',3),C('paper',0)],
   guide:[{say:'Step 1: tap the HAMMER 7 in your hand.',hand:0},{say:'Step 2: tap slot 1 to put it there.',slot:0}],
   ready:'All 3 slots are full. Press LOCK IN. You and the bot reveal at the same time.',
   judge:(r)=>({ok:true,say:'Round over! You won '+r.wins+' of 3 slots. Each slot is its own little fight: the winner deals damage to the loser. Win 2 of 3 to win the round.',learn:['Fill all 3 slots, then LOCK IN','Both sides reveal at the same time','Win 2 of 3 slots to win the round']})},
 2:{say:'The bot shows its cards. Beat ALL three! Hammer beats Scissors, Scissors beats Paper, Paper beats Hammer.',
   opp:[C('scissors',5),C('hammer',5),C('paper',5)],faceUp:true,hand:[C('hammer',3),C('paper',8),C('scissors',6),C('hammer',9),C('paper',1)],circle:true,
   ready:'Looks good? Press LOCK IN.',
   judge:(r)=>r.wins===3?{ok:true,say:'PERFECT SWEEP! You won all 3 slots, which deals 5 bonus damage on top.',learn:['Hammer > Scissors > Paper > Hammer','Same suit: higher number wins','Win all 3 slots: +5 bonus damage']}
    :{ok:false,say:(()=>{const i=r.res.findIndex(x=>x.w!==0);return 'Slot '+(i+1)+' got away from you. '+why(r.mine[i],r.opp[i],r.res[i])+' Take it back and try another card.'})()}},
 3:{say:'Damage is the GAP between the two numbers. Deal 18 or more damage this round. Put big numbers where they win!',
   opp:[C('hammer',3),C('paper',2),C('scissors',4)],faceUp:true,hand:[C('paper',9),C('scissors',7),C('hammer',8),C('hammer',5),C('scissors',2)],circle:true,target:18,
   ready:'Count the gaps in your head, then LOCK IN.',
   judge:(r)=>r.dmgOpp>=18&&r.wins>=2?{ok:true,say:'Nice! '+r.dmgOpp+' damage'+(r.wins===3?' (including the +5 sweep bonus)':'')+'. A big number against a small one wins big.',learn:['Damage = difference between the numbers','Different suits with the same number: damage is doubled','Pick the matchups where your gap is largest']}
    :{ok:false,say:'Only '+r.dmgOpp+' damage, you need 18. Sweeping all 3 slots adds +5. Try to win every slot, and match a high number with a low enemy card.'}},
 4:{say:'Win the round (2 of 3 slots) to earn a discard. The bot shows its cards: pick cards that beat them.',
   opp:[C('scissors',2),C('hammer',3),C('paper',1)],faceUp:true,hand:[C('hammer',7),C('paper',6),C('scissors',8),C('hammer',2),C('paper',4)],circle:true,
   ready:'Ready? Press LOCK IN.',
   judge:(r)=>r.wins>=2?{ok:true,discard:true,say:'You won the round! As the winner you choose ONE of your played cards to throw away for good. Tap the card you want to discard.',learn:['The round winner picks one played card to discard','The loser discards a random card','Other played cards return to your hand and you draw a new one','Discarded cards never come back']}
    :{ok:false,say:'You need to win at least 2 of the 3 slots. Match each bot card with the suit that beats it.'}}
};
const SWEEP=5;
function stage(k){
 const L=LV[k];
 let slots,sel,phase,gi,note,tone,shown,fx,hpBot,hpMe,tries=0,token=0,gone=null;
 const root=el('div',{class:'stage'});
 function reset(){slots=[null,null,null];sel=null;phase='plan';gi=L.guide?0:99;note=tries>0?note:null;shown=L.faceUp?3:0;fx=[null,null,null];hpBot=100;hpMe=100;gone=null}
 reset();
 const placed=()=>slots.filter(x=>x!==null).length;
 const hand=()=>L.hand.map((c,i)=>({c,i})).filter(h=>!slots.includes(h.i));
 function coachText(){
  if(note)return note;
  if(gi<(L.guide||[]).length)return L.guide[gi].say;
  if(placed()===3)return L.ready;
  return L.say;
 }
 function place(i,s){slots[s]=i;sel=null;if(gi<(L.guide||[]).length&&L.guide[gi].slot===s)gi++;note=null;draw();}
 function pick(i){
  if(phase!=='plan')return;
  const g=(L.guide||[])[gi];
  if(g&&g.hand!==undefined&&g.hand!==i)return;
  sel=sel===i?null:i;
  if(g&&g.hand===i&&sel===i)gi++;
  draw();
 }
 function slotTap(s){
  if(phase==='discard'&&slots[s]!==null){
   gone=s;phase='win';note='Discarded! The other two cards go back to your hand and you draw a new card next round. Discarded cards never return, so choose wisely.';draw();
   if(window.BBK)BBK.tutorial.set(k);return;}
  if(phase!=='plan')return;
  const g=(L.guide||[])[gi];
  if(slots[s]!==null){if(g)return;slots[s]=null;sel=null;note=null;draw();return;}
  if(sel===null)return;
  if(g&&g.slot!==undefined&&g.slot!==s)return;
  place(sel,s);
 }
 async function lock(){
  if(phase!=='plan'||placed()<3)return;
  const my=token;phase='reveal';sel=null;note='Revealing…';draw();
  if(!L.faceUp){for(let i=0;i<3;i++){await wait(350);if(my!==token)return;shown=i+1;draw();}}
  const mine=slots.map(i=>L.hand[i]),res=mine.map((c,i)=>clash(c,L.opp[i]));
  let wins=0,dmgOpp=0;
  for(let i=0;i<3;i++){
   await wait(750);if(my!==token)return;
   fx[i]=res[i];
   if(res[i].w===0){wins++;dmgOpp+=res[i].dmg;hpBot=Math.max(0,hpBot-res[i].dmg);}
   else if(res[i].w===1)hpMe=Math.max(0,hpMe-res[i].dmg);
   draw();
  }
  if(wins===3){await wait(600);if(my!==token)return;dmgOpp+=SWEEP;hpBot=Math.max(0,hpBot-SWEEP);}
  const v=L.judge({wins,dmgOpp,res,mine,opp:L.opp});
  await wait(500);if(my!==token)return;
  if(v.ok&&v.discard){phase='discard';tone='ok';note=v.say;L._learn=v.learn;draw();return;}
  phase=v.ok?'win':'fail';tone=v.ok?'ok':'bad';note=v.say;L._learn=v.learn;draw();
  if(v.ok&&window.BBK)BBK.tutorial.set(k);
 }
 function retry(){tries++;const n=note;reset();note='Try again. '+(n||'');draw();}
 function draw(){
  const g=(L.guide||[])[gi];
  const oppRow=el('div',{class:'row3'},L.opp.map((c,i)=>{
   if(i>=shown)return el('div',{class:'back','aria-label':'Hidden enemy card'});
   const win=fx[i]&&fx[i].w===1,lose=fx[i]&&fx[i].w===0;
   return card(c.suit,c.n,(win?'win ':'')+(lose?'lose ':'')+(phase==='reveal'&&!L.faceUp&&i===shown-1&&!fx[0]?'flip':''));
  }));
  const pills=el('div',{class:'row3 pills'},[0,1,2].map(i=>{
   const f=fx[i];
   if(!f)return el('div',{class:'pill',text:(i+1)+' VS '+(i+1)});
   if(f.w<0)return el('div',{class:'pill',text:'TIE'});
   return el('div',{class:'pill '+(f.w===0?'me':'bot'),text:(f.w===0?'YOU':'BOT')+' −'+f.dmg});
  }));
  const slotRow=el('div',{class:'row3'},slots.map((hi,s)=>{
   if(hi!==null){const c=L.hand[hi],f=fx[s];
    return card(c.suit,c.n,(gone===s?'gone ':'')+(phase==='discard'?'hint ':'')+(f&&f.w===0?'win ':'')+(f&&f.w===1?'lose ':''),'button',{onclick:()=>slotTap(s),title:'Tap to take it back','aria-label':NAME[c.suit]+' '+c.n+' in slot '+(s+1)+(phase==='plan'?', tap to take back':phase==='discard'?', tap to discard':''),disabled:(phase!=='plan'&&phase!=='discard')?'':undefined});}
   const hint=phase==='plan'&&((g&&g.slot===s)||(!g&&sel!==null));
   return el('button',{type:'button',class:'crt-slot'+(hint?' hint':''),text:String(s+1),'aria-label':'Empty slot '+(s+1),onclick:()=>slotTap(s)});
  }));
  const hp=(who,v,cls)=>el('div',{class:'crt-panel hpp '+cls},el('div',{class:'t'},el('span',{text:who}),el('span',{style:'color:var(--crt-mute)',text:v+' HP'})),el('div',{class:'crt-bar'},el('i',{style:'width:'+v+'%'})));
  const handEls=hand().map(({c,i})=>{
   const dis=phase!=='plan'||(g&&g.hand!==undefined&&g.hand!==i);
   const isHint=phase==='plan'&&g&&g.hand===i&&sel!==i;
   return card(c.suit,c.n,(sel===i?'sel ':'')+(isHint?'hint':''),'button',{onclick:()=>pick(i),disabled:dis?'':undefined,'aria-label':NAME[c.suit]+' '+c.n+(sel===i?', selected':'')});
  });
  const full=placed()===3&&phase==='plan';
  const btn=phase==='discard'?el('button',{type:'button',class:'crt-btn',disabled:'',text:'CHOOSE A CARD TO DISCARD'}):phase==='win'?el('button',{type:'button',class:'crt-btn teal',text:k<4?'NEXT LESSON':'NEXT: PRACTICE MATCH',onclick:()=>{token++;go(k+1)}})
   :phase==='fail'?el('button',{type:'button',class:'crt-btn coral',text:'TRY AGAIN',onclick:retry})
   :el('button',{type:'button',class:'crt-btn'+(full?' hint':''),disabled:full?undefined:'',text:phase==='reveal'?'REVEALING…':'LOCK IN '+placed()+' / 3',onclick:lock});
  const circle=L.circle?el('div',{class:'circle'},['hammer','scissors','paper','hammer'].map((s,i)=>[i?el('span',{text:'>'}):null,el('span',{},svg('i-'+s,16,16),NAME[s].toUpperCase())]).flat().filter(Boolean)):null;
  const learn=(phase==='win'&&L._learn)?el('div',{class:'crt-panel stack'},el('b',{style:'font-size:11px;color:#6fd3a0',text:'YOU LEARNED'}),...L._learn.map(t=>el('p',{class:'crt-note',text:'• '+t}))):null;
  root.replaceChildren(...[
   hp('TRAINING BOT',hpBot,'bot'),oppRow,pills,slotRow,hp('YOU',hpMe,'me'),circle,
   el('div',{class:'coach '+(phase==='win'?'ok':phase==='fail'?'bad':''),role:'status'},el('span',{class:'face'},svg('i-hand',24,24)),el('p',{text:coachText()})),
   learn,
   el('div',{class:'hand','aria-label':'Your hand'},handEls),
   btn].flat(2).filter(Boolean));
 }
 stage.cancel=()=>{token++};
 draw();return root;
}
function lesson5(){
 const done=step()>=5;
 return el('div',{class:'stack'},
  el('div',{class:'crt-panel stack'},el('b',{style:'font-size:12px;color:var(--crt-gold)',text:'YOUR FIRST REAL MATCH'}),
   P('Play one full match against the training bot on EASY. Win it and the tutorial is complete.'),
   P('Tips: fill every slot, follow the circle, and save big numbers for slots you are sure to win.')),
  done?el('div',{class:'crt-panel',style:'background:#2f9a6e;color:var(--crt-dark)',text:'Already complete. You can replay it any time.'}):null,
  el('a',{class:'crt-btn coral',href:'./index.html?practice=1',text:done?'PLAY AGAIN':'START PRACTICE MATCH'}));
}

function render(){
 let body;
 if(view===null)body=hub();
 else{
  const s=step();
  if(view>s+1){view=null;body=hub();}
  else body=[head('LESSON '+view+' / 5'),el('div',{class:'stack'},el('b',{style:'font-size:14px;letter-spacing:.06em',text:LESSONS[view-1].t}),(view===5?lesson5:()=>stage(view))())];
 }
 app.replaceChildren(...[].concat(body));
}
render();
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||e.defaultPrevented)return;if(view===null)location.href='./index.html';else go(null)});
if(window.BBK)BBK.onChange(()=>{if(view===null)render();});
})();
</script>
